user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;

        location = / {
            return 302 /skill-library/;
        }

        location /skill-library/ {
            alias /var/www/html/my-skill-agents-library/;
            try_files $uri $uri/ /skill-library/index.html;
        }

        # An exact (=) match takes priority over the prefix location above.
        location = /skill-library/api {
            proxy_pass http://unix:/run/skill-agents-library/sock:/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
